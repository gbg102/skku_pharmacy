<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>약전람 · 약학정보 학습노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F6F1;
    --paper-2:#EDEFE7;
    --ink:#1E2B2A;
    --ink-soft:#4A5652;
    --line:#D9DCD1;
    --green:#2F6F5E;
    --green-deep:#1F4D40;
    --amber:#B8752B;
    --amber-bg:#FBF0DF;
    --red:#A23B2E;
    --red-bg:#F8E9E5;
    --card:#FFFFFF;
    --sidebar:#1E2B2A;
    --sidebar-soft:#B7C4BE;
    --sidebar-line:#33443F;
    --radius:3px;
    --serif:'Source Serif 4', Georgia, serif;
    --sans:'IBM Plex Sans KR','IBM Plex Sans',sans-serif;
    --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ---------- layout ---------- */
  .app{
    display:grid;
    grid-template-columns:272px 1fr;
    min-height:100vh;
  }
  @media (max-width:860px){
    .app{grid-template-columns:1fr;}
    .sidebar{position:fixed; top:0; left:0; height:100vh; z-index:40; transform:translateX(-100%); transition:transform .25s ease;}
    .sidebar.open{transform:translateX(0);}
    .scrim{display:none; position:fixed; inset:0; background:rgba(10,14,13,.45); z-index:30;}
    .scrim.show{display:block;}
    .menu-btn{display:inline-flex !important;}
  }

  /* ---------- sidebar ---------- */
  .sidebar{
    background:var(--sidebar);
    color:var(--sidebar-soft);
    padding:22px 0 40px;
    overflow-y:auto;
  }
  .brand{
    padding:0 20px 18px;
    border-bottom:1px solid var(--sidebar-line);
    margin-bottom:14px;
  }
  .brand .mark{
    display:flex; align-items:center; gap:9px;
    font-family:var(--serif); font-weight:700; font-size:20px; color:#F2F4EF;
  }
  .brand .mark svg{flex:none;}
  .brand .tag{font-size:12px; color:#8FA098; margin-top:5px; letter-spacing:.01em;}

  .nav-group{margin-bottom:4px;}
  .nav-label{
    font-size:11px; color:#7A8A82; padding:14px 20px 6px;
    font-weight:500;
  }
  .nav-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 20px;
    cursor:pointer;
    font-size:14px;
    color:var(--sidebar-soft);
    border-left:3px solid transparent;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item:hover{background:rgba(255,255,255,.04); color:#F2F4EF;}
  .nav-item.active{
    background:rgba(122,190,168,.10);
    border-left-color:#7ABEA8;
    color:#F2F4EF;
    font-weight:500;
  }
  .nav-item .count{
    font-family:var(--mono); font-size:11px; color:#6E7E76;
    background:rgba(255,255,255,.05); padding:1px 6px; border-radius:10px;
  }
  .nav-item.active .count{color:#CDEAE0; background:rgba(122,190,168,.18);}

  /* ---------- topbar ---------- */
  .topbar{
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:16px 34px;
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:16px;
  }
  .menu-btn{
    display:none; align-items:center; justify-content:center;
    width:34px; height:34px; border:1px solid var(--line); background:var(--card);
    border-radius:var(--radius); cursor:pointer; flex:none;
  }
  .search-wrap{position:relative; flex:1; max-width:520px;}
  .search-wrap input{
    width:100%; padding:9px 14px 9px 34px;
    border:1px solid var(--line); border-radius:var(--radius);
    background:var(--card); font-family:var(--sans); font-size:14px; color:var(--ink);
  }
  .search-wrap input:focus{outline:none; border-color:var(--green);}
  .search-wrap svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.45;}
  .search-results{
    position:absolute; top:calc(100% + 6px); left:0; right:0;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:0 8px 24px rgba(20,30,28,.10);
    max-height:360px; overflow-y:auto; z-index:50; display:none;
  }
  .search-results.show{display:block;}
  .sr-item{padding:10px 14px; cursor:pointer; border-bottom:1px solid var(--paper-2);}
  .sr-item:last-child{border-bottom:none;}
  .sr-item:hover{background:var(--paper-2);}
  .sr-item .sr-name{font-weight:600; font-size:14px;}
  .sr-item .sr-meta{font-size:12px; color:var(--ink-soft); margin-top:1px;}
  .sr-empty{padding:16px; font-size:13px; color:var(--ink-soft);}

  /* ---------- main ---------- */
  main{padding:34px; max-width:920px;}

  .hero{
    padding-bottom:22px; margin-bottom:26px; border-bottom:1px solid var(--line);
  }
  .hero h1{
    font-family:var(--serif); font-weight:700; font-size:32px; margin:0 0 8px;
    letter-spacing:-.01em;
  }
  .hero p{margin:0 0 14px; color:var(--ink-soft); font-size:15px; max-width:640px;}
  .hero-stats{display:flex; gap:22px; flex-wrap:wrap;}
  .hero-stats div{font-size:13px; color:var(--ink-soft);}
  .hero-stats b{font-family:var(--serif); font-size:19px; color:var(--green-deep); display:block;}

  .section-head{margin:0 0 18px;}
  .section-head h2{font-family:var(--serif); font-size:23px; font-weight:700; margin:0 0 4px;}
  .section-head p{margin:0; color:var(--ink-soft); font-size:14px;}

  /* ---------- monograph card ---------- */
  .mono-list{display:flex; flex-direction:column; gap:16px;}
  .mono-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    position:relative;
    padding:20px 22px 20px 24px;
    border-left:4px solid var(--green);
  }
  .mono-tab{
    font-size:11px; color:var(--green-deep); font-weight:500;
    margin-bottom:6px;
  }
  .mono-card h3{
    font-family:var(--serif); font-size:20px; font-weight:700; margin:0 0 6px;
  }
  .mono-examples{
    font-family:var(--mono); font-size:12px; color:var(--ink-soft);
    margin-bottom:14px;
  }
  .mono-examples span{
    background:var(--paper-2); padding:2px 7px; border-radius:2px; margin-right:6px; display:inline-block; margin-bottom:4px;
  }
  .mono-field{padding:9px 0; border-top:1px solid var(--paper-2); display:flex; gap:14px;}
  .mono-field:first-of-type{border-top:none;}
  .mono-field .flabel{
    flex:none; width:96px; font-size:12.5px; font-weight:600; padding-top:1px;
    display:flex; align-items:flex-start; gap:6px;
  }
  .mono-field .flabel i{width:7px; height:7px; border-radius:1px; margin-top:5px; flex:none; display:inline-block;}
  .mono-field .ftext{flex:1; font-size:14px; color:var(--ink);}
  .flabel.moa i{background:var(--green);}
  .flabel.ind i{background:#5B7FB5;}
  .flabel.adv i{background:var(--amber);}
  .flabel.caution i{background:var(--red);}
  .flabel.inter i{background:#7A5EA8;}

  /* ---------- concept / glossary cards ---------- */
  .concept-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:640px){.concept-grid{grid-template-columns:1fr;}}
  .concept-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px;
  }
  .concept-card h4{
    font-family:var(--serif); font-size:16px; margin:0 0 6px; font-weight:700;
  }
  .concept-card p{margin:0; font-size:13.5px; color:var(--ink-soft);}

  /* ---------- protocol card ---------- */
  .proto-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 22px; margin-bottom:16px; border-left:4px solid #5B7FB5;
  }
  .proto-card h3{font-family:var(--serif); font-size:19px; font-weight:700; margin:0 0 6px;}
  .proto-overview{font-size:13.5px; color:var(--ink-soft); margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--paper-2);}
  .proto-steps{list-style:none; margin:0 0 14px; padding:0; counter-reset:step;}
  .proto-steps li{
    counter-increment:step; position:relative; padding:8px 0 8px 34px; font-size:14px;
    border-top:1px solid var(--paper-2);
  }
  .proto-steps li:first-child{border-top:none;}
  .proto-steps li::before{
    content:counter(step); position:absolute; left:0; top:8px;
    width:22px; height:22px; border-radius:50%; background:#EDF1F7; color:#3E5A87;
    font-family:var(--mono); font-size:11.5px; font-weight:500;
    display:flex; align-items:center; justify-content:center;
  }
  .proto-steps li b{font-weight:600;}
  .proto-foot{display:flex; gap:14px; flex-wrap:wrap; font-size:13px;}
  .proto-foot div{flex:1; min-width:220px;}
  .proto-foot .flabel-sm{font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:3px; display:flex; align-items:center; gap:6px;}
  .proto-foot .flabel-sm i{width:7px; height:7px; border-radius:1px; display:inline-block;}
  .proto-foot .drugs i{background:var(--green);}
  .proto-foot .caution i{background:var(--red);}

  /* ---------- special population card ---------- */
  .pop-overview{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:18px; font-size:14px; color:var(--ink-soft);
    border-left:4px solid #7A5EA8;
  }
  .prin-list{list-style:none; margin:0 0 24px; padding:0; display:flex; flex-direction:column; gap:0;}
  .prin-list li{
    display:flex; gap:12px; padding:11px 0; border-top:1px solid var(--paper-2); font-size:14px;
  }
  .prin-list li:first-child{border-top:none;}
  .prin-list li i{
    flex:none; width:7px; height:7px; border-radius:1px; background:#7A5EA8; margin-top:7px;
  }
  .prin-list li b{font-weight:600;}
  .pop-table-head{font-family:var(--serif); font-size:16px; font-weight:700; margin:0 0 10px;}

  /* ---------- tables ---------- */
  table{width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  thead th{
    text-align:left; font-size:12px; font-weight:600; color:var(--ink-soft);
    padding:10px 14px; background:var(--paper-2); border-bottom:1px solid var(--line);
  }
  tbody td{padding:12px 14px; font-size:13.5px; border-bottom:1px solid var(--paper-2); vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  .sev{
    display:inline-block; padding:2px 8px; border-radius:10px; font-size:11.5px; font-weight:500;
  }
  .sev.high{background:var(--red-bg); color:var(--red);}
  .sev.mid{background:var(--amber-bg); color:var(--amber);}
  .mono-col{font-family:var(--mono); font-size:12.5px;}

  .abbr-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 28px;}
  @media (max-width:640px){.abbr-grid{grid-template-columns:1fr;}}
  .abbr-row{display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--paper-2); font-size:14px;}
  .abbr-row .a{font-family:var(--mono); font-weight:500; color:var(--green-deep);}
  .abbr-row .b{color:var(--ink-soft); text-align:right;}

  footer{padding:30px 34px 60px; color:var(--ink-soft); font-size:12.5px; border-top:1px solid var(--line); margin-top:10px;}
</style>
</head>
<body>

<div class="scrim" id="scrim"></div>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 14.5L14.5 6a4 4 0 0 1 5.66 5.66L11.66 20.2a4 4 0 0 1-5.66-5.66z" stroke="#7ABEA8" stroke-width="1.6"/><path d="M9.5 11L14.5 16" stroke="#7ABEA8" stroke-width="1.6" stroke-linecap="round"/></svg>
        약전람
      </div>
      <div class="tag">약대생을 위한 약학정보 학습노트</div>
    </div>

    <div class="nav-group">
      <div class="nav-label">약물 분류</div>
      <div id="nav-categories"></div>
    </div>

    <div class="nav-group">
      <div class="nav-label">임상 프로토콜</div>
      <div class="nav-item" data-view="protocols">질환별 치료 알고리즘 <span class="count" id="cnt-proto"></span></div>
    </div>

    <div class="nav-group">
      <div class="nav-label">특수 집단 고려사항</div>
      <div id="nav-populations"></div>
    </div>

    <div class="nav-group">
      <div class="nav-label">핵심 개념</div>
      <div class="nav-item" data-view="concepts">약동학·약력학 <span class="count" id="cnt-concepts"></span></div>
      <div class="nav-item" data-view="interactions">주요 약물상호작용 <span class="count" id="cnt-inter"></span></div>
      <div class="nav-item" data-view="abbr">처방 약어 사전 <span class="count" id="cnt-abbr"></span></div>
    </div>
  </aside>

  <div>
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="#1E2B2A" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#1E2B2A" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="#1E2B2A" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="searchInput" type="text" placeholder="약물명, 계열, 개념으로 검색 (예: metformin, 반감기, 세로토닌 증후군)">
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>

    <main id="main"></main>

    <footer>
      본 자료는 약대생의 학습 보조 목적의 요약 정리이며, 실제 처방·조제·복약지도의 근거자료로 사용할 수 없습니다.
      최신 허가사항 및 용량은 반드시 최신 첨부문서(약학정보원, KIMS, 식약처)와 지도교수·약사의 확인을 거치세요.
    </footer>
  </div>

</div>

<script>
/* =========================================================
   DATA
   ========================================================= */
const CATEGORIES = [
  {
    id:'cv', name:'심혈관계', icon:'❤',
    desc:'혈압, 심박, 지질, 응고에 작용하는 약물군',
    items:[
      {name:'ACE 억제제', examples:['enalapril','lisinopril','captopril','ramipril'],
        moa:'안지오텐신전환효소(ACE)를 억제하여 안지오텐신Ⅱ 생성을 감소시키고, 브라디키닌 분해를 억제해 혈관을 확장한다.',
        ind:'고혈압, 심부전, 당뇨병성 신증(단백뇨 감소), 심근경색 후 관리',
        adv:'마른기침(브라디키닌 축적), 고칼륨혈증, 혈관부종, 급성신손상(양측 신동맥협착 시)',
        caution:'임신부 금기(태아 신장기형), 양측 신동맥협착 환자 주의, 혈청 크레아티닌·칼륨 모니터링 필요',
        inter:'칼륨보존이뇨제·칼륨보충제와 병용 시 고칼륨혈증 위험, NSAIDs 병용 시 신기능 저하 위험 증가'},
      {name:'ARB (안지오텐신Ⅱ 수용체차단제)', examples:['losartan','valsartan','candesartan'],
        moa:'안지오텐신Ⅱ의 AT1 수용체 결합을 차단하여 혈관수축·알도스테론 분비를 억제한다.',
        ind:'고혈압, 심부전, 당뇨병성 신증 (ACE 억제제 기침 부작용 시 대체)',
        adv:'고칼륨혈증, 어지러움, 드물게 혈관부종(ACE 억제제보다 빈도 낮음)',
        caution:'임신부 금기, 양측 신동맥협착 주의',
        inter:'ACE 억제제와 병용 비권장(상승적 고칼륨혈증·신기능 저하), 칼륨보존이뇨제 병용 주의'},
      {name:'칼슘채널차단제 (CCB)', examples:['amlodipine (DHP계)','diltiazem, verapamil (non-DHP계)'],
        moa:'전압작동 L형 칼슘통로를 차단하여 혈관평활근 이완(DHP계) 또는 심근·방실결절 전도 억제(non-DHP계)를 일으킨다.',
        ind:'고혈압, 협심증, 부정맥(non-DHP계), 레이노병',
        adv:'말초부종, 두통, 홍조(DHP계), 서맥·변비·방실차단(non-DHP계)',
        caution:'심부전(수축기능저하) 환자에서 non-DHP계 주의, 베타차단제와 non-DHP계 병용 시 과도한 방실차단 위험',
        inter:'그레이프프루트주스는 CYP3A4 억제로 DHP계 혈중농도를 상승시킴, 베타차단제와 verapamil/diltiazem 병용 시 서맥·심차단 위험'},
      {name:'베타차단제', examples:['metoprolol','propranolol','carvedilol','bisoprolol'],
        moa:'β1(심장) 및/또는 β2(기관지·혈관) 아드레날린 수용체를 차단하여 심박수·수축력·전도속도를 감소시킨다.',
        ind:'고혈압, 협심증, 심부전(carvedilol 등 일부), 부정맥, 심근경색 후 이차예방',
        adv:'서맥, 피로, 저혈압, 기관지수축(비선택적 제제에서 천식 악화 가능), 말초혈관수축',
        caution:'천식·COPD 환자는 β1 선택적 제제 신중 투여, 급격한 중단 시 반동성 빈맥·협심증 위험(서서히 감량)',
        inter:'non-DHP CCB·디곡신과 병용 시 서맥·방실차단 위험, 인슐린 저혈당 증상(빈맥) 은폐 가능'},
      {name:'이뇨제', examples:['furosemide (루프)','hydrochlorothiazide (티아지드)','spironolactone (칼륨보존)'],

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

function navHtml(){
  return CATEGORIES.map(c => `
    <div class="nav-item" data-view="cat:${c.id}">
      <span>${c.icon}&nbsp; ${c.name}</span>
      <span class="count">${c.items.length}</span>
    </div>`).join('');
}

function heroHtml(){
  const totalDrugs = CATEGORIES.reduce((s,c)=>s+c.items.length,0);
  return `
  <div class="hero">
    <h1>약전람</h1>
    <p>약대생의 학습을 돕기 위해 계열별 약물, 질환별 치료 알고리즘, 특수 집단(소아·노인·신장애·간장애) 용량조절, 약동학·약력학 핵심개념, 임상적으로 중요한 약물상호작용, 처방 약어를 한 곳에 정리한 학습 참조노트입니다. 각 항목은 시험·실습 전 빠른 복습용으로 구성했습니다.</p>
    <div class="hero-stats">
      <div><b>${CATEGORIES.length}</b>약물 계열 대분류</div>
      <div><b>${totalDrugs}</b>약물군 요약</div>
      <div><b>${PROTOCOLS.length}</b>질환별 치료 알고리즘</div>
      <div><b>${POPULATIONS.length}</b>특수 집단 가이드</div>
      <div><b>${CONCEPTS.length}</b>PK·PD 핵심개념</div>
      <div><b>${INTERACTIONS.length}</b>주요 상호작용</div>
    </div>
  </div>`;
}

function monoCard(item, catName){
  return `
  <div class="mono-card">
    <div class="mono-tab">${catName}</div>
    <h3>${item.name}</h3>
    <div class="mono-examples">${item.examples.map(e=>`<span>${e}</span>`).join('')}</div>
    <div class="mono-field"><div class="flabel moa"><i></i>작용기전</div><div class="ftext">${item.moa}</div></div>
    <div class="mono-field"><div class="flabel ind"><i></i>적응증</div><div class="ftext">${item.ind}</div></div>
    <div class="mono-field"><div class="flabel adv"><i></i>주요 부작용</div><div class="ftext">${item.adv}</div></div>
    <div class="mono-field"><div class="flabel caution"><i></i>주의·금기</div><div class="ftext">${item.caution}</div></div>
    <div class="mono-field"><div class="flabel inter"><i></i>상호작용</div><div class="ftext">${item.inter}</div></div>
  </div>`;
}

function renderCategory(catId){
  const cat = CATEGORIES.find(c=>c.id===catId);
  const main = $('#main');
  main.innerHTML = `
    <div class="section-head">
      <h2>${cat.icon}&nbsp; ${cat.name}</h2>
      <p>${cat.desc} · 총 ${cat.items.length}개 약물군</p>
    </div>
    <div class="mono-list">${cat.items.map(i=>monoCard(i, cat.name)).join('')}</div>
  `;
}

function protoCard(p){
  return `
  <div class="proto-card">
    <h3>${p.name}</h3>
    <div class="proto-overview">${p.overview}</div>
    <ol class="proto-steps">
      ${p.steps.map(s=>`<li><b>${s.t}</b> — ${s.d}</li>`).join('')}
    </ol>
    <div class="proto-foot">
      <div><div class="flabel-sm drugs"><i></i>핵심 약물</div>${p.drugs}</div>
      <div><div class="flabel-sm caution"><i></i>주의사항</div>${p.caution}</div>
    </div>
  </div>`;
}

      <h2>질환별 치료 알고리즘</h2>
      <p>대표적인 질환에서 약물치료가 단계적으로 어떻게 강화·전환되는지 정리한 요약 프로토콜 ${PROTOCOLS.length}가지</p>

    <div class="section-head">
      <h2>처방 약어 사전</h2>
      <p>처방전·투약지시에서 자주 쓰이는 약어 ${ABBR.length}가지</p>
    </div>
    <div class="abbr-grid">
      ${ABBR.map(r=>`<div class="abbr-row"><span class="a">${r.a}</span><span class="b">${r.b}</span></div>`).join('')}

function renderHome(){
  $('#main').innerHTML = heroHtml() + `
    <div class="section-head">
      <h2>둘러보기</h2>
      <p>왼쪽 메뉴에서 계열을 선택하거나, 상단 검색창으로 원하는 약물·개념을 바로 찾아보세요.</p>
    </div>
    <div class="mono-list">
      ${CATEGORIES.map(c=>`
        <div class="mono-card" style="border-left-color:#5B7FB5; cursor:pointer" data-jump="cat:${c.id}">
          <div class="mono-tab">${c.items.length}개 약물군</div>
          <h3>${c.icon}&nbsp; ${c.name}</h3>
          <div class="ftext" style="color:var(--ink-soft); font-size:14px;">${c.desc} — ${c.items.slice(0,4).map(i=>i.name).join(', ')} 등</div>
        </div>`).join('')}
    </div>
  `;
  $$('[data-jump]').forEach(el=>el.addEventListener('click', ()=>setView(el.dataset.jump)));
}

function setView(view){
  $$('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.view===view));
  if(view==='home') renderHome();
  else if(view==='protocols') renderProtocols();
  else if(view.startsWith('pop:')) renderPopulation(view.slice(4));
  else if(view==='concepts') renderConcepts();
  else if(view==='interactions') renderInteractions();
  else if(view==='abbr') renderAbbr();
  else if(view.startsWith('cat:')) renderCategory(view.slice(4));
  window.scrollTo({top:0,behavior:'instant'});
  closeSidebarMobile();
}

/* ---------- search ---------- */
function buildSearchIndex(){
  const idx = [];
  CATEGORIES.forEach(cat=>{
    cat.items.forEach(item=>{
      idx.push({
        type:'drug', view:`cat:${cat.id}`,
        title:item.name, meta:`${cat.name} · ${item.examples[0]}`,
        haystack:(item.name+' '+item.examples.join(' ')+' '+item.moa+' '+item.ind+' '+item.adv+' '+item.caution+' '+item.inter).toLowerCase()
      });
    });
  });
  CONCEPTS.forEach(c=>{
    idx.push({type:'concept', view:'concepts', title:c.term, meta:'PK·PD 개념', haystack:(c.term+' '+c.def).toLowerCase()});
  });
  INTERACTIONS.forEach(r=>{
    idx.push({type:'inter', view:'interactions', title:`${r.a} + ${r.b}`, meta:'약물상호작용', haystack:(r.a+' '+r.b+' '+r.effect).toLowerCase()});
  });
  PROTOCOLS.forEach(p=>{
    idx.push({type:'proto', view:'protocols', title:p.name, meta:'치료 알고리즘', haystack:(p.name+' '+p.overview+' '+p.drugs+' '+p.steps.map(s=>s.t+' '+s.d).join(' ')).toLowerCase()});
  });
  POPULATIONS.forEach(p=>{
    idx.push({type:'pop', view:`pop:${p.id}`, title:p.name, meta:'특수 집단 고려사항',
      haystack:(p.name+' '+p.overview+' '+p.principles.map(pr=>pr.t+' '+pr.d).join(' ')+' '+p.table.rows.map(r=>r.join(' ')).join(' ')).toLowerCase()});
  });
  return idx;
}
const SEARCH_INDEX = buildSearchIndex();

function runSearch(q){
  const box = $('#searchResults');
  if(!q.trim()){ box.classList.remove('show'); box.innerHTML=''; return; }
  const query = q.toLowerCase();
  const hits = SEARCH_INDEX.filter(i=>i.haystack.includes(query)).slice(0,12);
  if(hits.length===0){
    box.innerHTML = `<div class="sr-empty">"${q}"에 대한 결과가 없습니다.</div>`;
  }else{
    box.innerHTML = hits.map(h=>`
      <div class="sr-item" data-view="${h.view}">
        <div class="sr-name">${h.title}</div>
        <div class="sr-meta">${h.meta}</div>
      </div>`).join('');
  }
  box.classList.add('show');
  $$('.sr-item', box).forEach(el=>el.addEventListener('click', ()=>{
    setView(el.dataset.view);
    box.classList.remove('show');
    $('#searchInput').value='';
  }));
}

/* ---------- mobile sidebar ---------- */
function closeSidebarMobile(){
  $('#sidebar').classList.remove('open');
  $('#scrim').classList.remove('show');
}

/* ---------- init ---------- */
document.addEventListener('DOMContentLoaded', ()=>{
  $('#nav-categories').innerHTML = navHtml();
  $('#nav-populations').innerHTML = navPopulationsHtml();
  $('#cnt-proto').textContent = PROTOCOLS.length;
  $('#cnt-concepts').textContent = CONCEPTS.length;
  $('#cnt-inter').textContent = INTERACTIONS.length;
  $('#cnt-abbr').textContent = ABBR.length;

  $$('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>setView(el.dataset.view));
  });

  $('#searchInput').addEventListener('input', e=>runSearch(e.target.value));
  document.addEventListener('click', e=>{
    if(!e.target.closest('.search-wrap')) $('#searchResults').classList.remove('show');
  });

  $('#menuBtn').addEventListener('click', ()=>{
    $('#sidebar').classList.add('open');
    $('#scrim').classList.add('show');
  });
  $('#scrim').addEventListener('click', closeSidebarMobile);

  renderHome();
});
</script>
