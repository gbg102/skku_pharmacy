<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>약대생 필수 & 신기한 Web Tools 가이드</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --subtext: #64748b;
      --border: #e2e8f0;
      --accent: #e0f2fe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #0f172a;
      color: #fff;
      padding: 2rem 1rem;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #38bdf8;
    }

    header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .category-nav {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      padding: 1rem;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .cat-btn {
      border: none;
      background: var(--bg);
      color: var(--subtext);
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--primary);
      color: white;
    }

    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      flex: 1;
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    }

    .card-header {
      padding: 1.2rem;
      border-bottom: 1px solid #f1f5f9;
    }

    .card-tag {
      font-size: 0.75rem;
      color: var(--primary);
      background: var(--accent);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 0.4rem;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
    }

    .card-body {
      padding: 1.2rem;
      flex: 1;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--subtext);
      margin-bottom: 1rem;
    }

    .features-list {
      list-style: none;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .features-list li {
      margin-bottom: 0.4rem;
      position: relative;
      padding-left: 1.2rem;
    }

    .features-list li::before {
      content: "✔";
      position: absolute;
      left: 0;
      color: var(--primary);
    }

    /* Mock Screen SVG Container */
    .mock-screen {
      background: #1e293b;
      border-radius: 8px;
      padding: 0.5rem;
      margin-top: 0.5rem;
      border: 1px solid #334155;
    }

    .mock-title {
      color: #94a3b8;
      font-size: 0.75rem;
      margin-bottom: 0.4rem;
      text-align: center;
      font-family: monospace;
    }

    .card-footer {
      padding: 1rem 1.2rem;
      background: #f8fafc;
      border-top: 1px solid var(--border);
    }

    .btn-link {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--primary);
      color: white;
      text-decoration: none;
      padding: 0.6rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn-link:hover {
      background: var(--primary-hover);
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--subtext);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <h1>💊 PharmTech Hub for Pharmacy Students</h1>
    <p>약대생을 위한 실무·전공 웹 도구 가이드 & 시각화 미니 뷰어</p>
  </header>

  <nav class="category-nav">
    <button class="cat-btn active" onclick="filterCategory('all')">전체 보기</button>
    <button class="cat-btn" onclick="filterCategory('target')">3D 구조 & 표적</button>
    <button class="cat-btn" onclick="filterCategory('medchem')">의약화학 & ADME</button>
    <button class="cat-btn" onclick="filterCategory('clinical')">약물상호작용 & 임상</button>
    <button class="cat-btn" onclick="filterCategory('illust')">학술 일러스트</button>
  </nav>

  <main>
    <div class="grid" id="tools-grid">
      <!-- Dynamic Content Generated by JavaScript -->
    </div>
  </main>

  <footer>
    <p>© PharmTech Explorer — 약학 공부와 연구 효율을 극대화하는 툴 모음</p>
  </footer>

        ],
        url: "https://go.drugbank.com",
        mockSvg: `
          <svg viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:auto;">

            <circle cx="150" cy="85" r="14" fill="#eab308"/>

            <circle cx="240" cy="60" r="16" fill="#10b981"/>

            <line x1="66" y1="55" x2="136" y2="38" stroke="#94a3b8" stroke-width="2"/>
            <line x1="66" y1="65" x2="136" y2="82" stroke="#94a3b8" stroke-width="2"/>

            <line x1="164" y1="82" x2="224" y2="65" stroke="#94a3b8" stroke-width="2"/>
          </svg>
        `
      },
      {
        id: 5,
        name: "AlphaFold DB",
        category: "target",
        categoryName: "3D 구조 & 표적",

      },
      {
        id: 6,
        name: "BioRender",
        category: "illust",

            <path d="M 150 85 L 150 105" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/>

            <text x="30" y="50" fill="#f472b6" font-size="8">Lipid Bilayer</text>
          </svg>
        `

    ];

    function renderCards(data) {
      const grid = document.getElementById('tools-grid');
      grid.innerHTML = data.map(item => `
        <div class="card">
          <div class="card-header">
            <span class="card-tag">${item.categoryName}</span>
            <h2 class="card-title">${item.name}</h2>
          </div>
          <div class="card-body">
            <p class="card-desc">${item.desc}</p>
            <ul class="features-list">
              ${item.features.map(f => `<li>${f}</li>`).join('')}
            </ul>
            <div class="mock-screen">
              <div class="mock-title">▼ ${item.name} 화면 예시 (Preview)</div>
              ${item.mockSvg}
            </div>
          </div>
          <div class="card-footer">
            <a href="${item.url}" target="_blank" class="btn-link">웹사이트 방문하기 ↗</a>
          </div>
        </div>
      `).join('');
    }

    function filterCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (cat === 'all') {
        renderCards(toolsData);
      } else {
        const filtered = toolsData.filter(item => item.category === cat);
        renderCards(filtered);
      }
    }

    // Initial Render
    renderCards(toolsData);
  </script>
</body>
</html>
